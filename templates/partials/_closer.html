{# Closing typographic CTA, staggered like the poster sign-off #}
<section class="closer dark sec-orange">
  <div class="wrap closer__inner reveal">
    <p class="closer__type" aria-label="We call you first.">
      <span class="l1">WE</span>
      <span class="l2">CALL</span>
      <span class="l3">YOU</span>
      <span class="l4">FIRST<em>.</em></span>
    </p>
    <div class="closer__side">
      <p class="lead">Send the collection point, destination, cargo type, approximate weight and preferred movement date. One named Ternion contact takes it from there.</p>
      <div class="btn-row">
        <a href="{% url 'contact' %}" class="btn">Request a freight quote <span aria-hidden="true">→</span></a>
        <a href="{{ company.whatsapp }}" class="btn btn--ghost" target="_blank" rel="noopener">WhatsApp us</a>
      </div>
    </div>
  </div>
</section>
